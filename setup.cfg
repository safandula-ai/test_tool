[pycodestyle]
max-line-length = 120
exclude =
    .git,
    .idea,
    .pytest_cache,
    .venv,
    __pycache__,
    reports

[flake8]
max-line-length = 120
exclude =
    .git,
    .idea,
    .pytest_cache,
    .venv,
    __pycache__,
    reports
per-file-ignores =
    tests/features/authentication/bdd/test_login_steps.py:E402
