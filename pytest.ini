[pytest]
# Keep output concise while preserving failure details.
addopts = -ra --alluredir=allure-results --clean-alluredir
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
asyncio_default_test_loop_scope = function
testpaths = tests
markers =
    api: API and contract tests
    ui: UI and E2E tests
    smoke: Fast validation tests
    bdd: Human-readable BDD scenarios
    e2e: Tests that call live external UI services
    integration: Tests that call live external APIs
    hybrid: Tests that prepare state through an API and verify it in the UI
    visual: Visual regression tests
    a11y: Accessibility-focused tests
    performance: Response-time and throughput checks
    security: Security verification and compliance checks
